name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Check public source boundary
        run: |
          python3 scripts/verify-public-source.py
          python3 scripts/verify-public-source.test.py
      - name: Install locked dependencies
        working-directory: plugins/telegram-channel
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: plugins/telegram-channel
        run: bun run typecheck
      - name: Audit locked dependencies
        working-directory: plugins/telegram-channel
        run: bun audit
      - name: Verify committed runtime bundles
        working-directory: plugins/telegram-channel
        run: |
          bun run verify:runtime
          bun run verify:runtime:test
      - name: Test the complete public plugin
        working-directory: plugins/telegram-channel
        env:
          CODEX_TELEGRAM_BUN_TEST_TIMEOUT_SECONDS: "30"
        run: bun run test
