name: CI

# One gate, one job, on the same remote Linux runners the other repositories use:
# Oracle primary and the Hetzner CAX11 reserve, reached through the shared label
# `codex-telegram-ci`. The operator's Mac is not a runner for this repository and
# the first step fails closed on anything that is not Linux, before checkout.
#
# The suite lives outside this repository on purpose (tests are never shipped),
# so the gate proves exactly what the published tree can prove about itself: the
# sources typecheck and the tree is formatted. Behaviour is verified locally
# against a real Codex host before a release, and the evidence goes in the PR.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, Linux, ARM64, codex-telegram-ci]
    # This repository is public, so a fork's pull request must never execute on
    # our own machines: it would run unreviewed code as the runner user. A fork
    # PR is skipped here and reviewed locally instead. Drafts are skipped too,
    # so a round is assembled before it costs a run.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    timeout-minutes: 15
    steps:
      - name: Refuse anything that is not a remote Linux runner
        run: |
          if [ "$(uname -s)" != Linux ]; then
            echo "::error::CI for this repository runs on the remote Linux runners only (Oracle primary, Hetzner reserve)."
            exit 1
          fi

      # Actions are pinned by commit: a moving tag is code we did not review.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Install development dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck the published sources
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check
