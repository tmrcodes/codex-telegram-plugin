name: CI

# One gate, one job, on a GitHub-hosted runner. Standard runners are free for
# public repositories, so this costs nothing and keeps pull-request code off our
# own machines — which is what a self-hosted runner on a public repository would
# invite. The image is pinned rather than `ubuntu-latest`: `latest` moves to the
# next LTS when GitHub migrates it, and a gate should not change under us.
#
# The suite lives outside this repository on purpose (tests are never shipped),
# so the gate proves exactly what the published tree can prove about itself: the
# sources typecheck and the tree is formatted. Behaviour is verified locally
# against a real Codex host before a release, and the evidence goes in the PR.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    # A draft is skipped so a round is assembled before it costs a run; a fork's
    # pull request is welcome here, because a GitHub-hosted runner is disposable
    # and holds nothing of ours.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit: a moving tag is code we did not review.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      # The lockfile is committed so an unchanged commit keeps compiling against the
      # same compiler and type definitions; `--frozen-lockfile` fails rather than
      # silently resolving something else.
      - name: Install development dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck the published sources
        run: bun run typecheck

      - name: Check formatting
        run: bun run format:check
